$wallpapers = ~/.config/hypr/lockscreen_kotone.jpg
$PROFILE = /home/chargerleptop/Downloads/kotone.jpeg

# BACKGROUND
background {
    monitor =
    path = $wallpapers
    blur_passes = 4
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    disable_loading_bar = false
    grace = 1
}

# --- LEFT COLUMN ---

# LOGIN CARD
shape {
    monitor =
    size = 360, 380
    color = rgba(0, 0, 0, 0.3)
    rounding = 25
    border_size = 0
    position = -200, 160
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] hostname
    color = rgba(185, 175, 165, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -200, 300
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:0] echo -e "<span line_height='0.75'>Welcome \nBack.</span>"
    color = rgba(240, 230, 220, 1.0)
    font_size = 42
    font_family = JetBrainsMono Nerd Font
    position = -200, 250
    halign = center
    valign = center
    zindex = 2
}

# Username Display
shape {
    monitor =
    size = 320, 70
    color = rgba(80, 171, 229, 1)
    rounding = 20
    position = -200, 130
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = username
    color = rgba(25, 20, 20, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -310, 150
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$USER</b>"
    color = rgba(25, 20, 20, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -250, 123
    halign = center
    valign = center
    zindex = 3
    text_align = left
}

# Password Input
label {
    monitor =
    text = password
    color = rgba(25, 20, 20, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -310, 60
    halign = center
    valign = center
    zindex = 3
}

input-field {
    monitor =
    size = 320, 70
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = false
    outer_color = rgba(80, 171, 229, 1)
    inner_color = rgba(80, 171, 229, 1)
    font_color = rgba(25, 20, 20, 1.0)
    fade_on_empty = false

    # Pango markup handles size (e.g. 10pt or small/75%) and vertical offset via rise
    placeholder_text =

    hide_input = false
    rounding = 20
    position = -200, 40
    halign = center
    valign = center
    zindex = 1
    text_align = left
}

# CLOCK CARD
shape {
    monitor =
    size = 360, 160
    color = rgba(0, 0, 0, 0.3)
    rounding = 25
    position = -200, -140
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] date +"<b>%H:%M</b>"
    color = rgba(240, 230, 220, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = -200, -125
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] uptime -p | sed -e 's/up /  System Uptime : /' -e 's/ hours, /H/' -e 's/ minutes/M/' -e 's/ hour, /H/' -e 's/ minute/M/'
    color = rgba(185, 175, 165, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -220, -188
    halign = center
    valign = center
    zindex = 2
}


# --- RIGHT COLUMN ---

# PROFILE CARD (Blurred)
shape {
    monitor =
    size = 360, 380
    color = rgba(223, 220, 219, 0.3)
    rounding = 25
    position = 200, 160
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = $PROFILE
    size = 120
    rounding = 20
    border_size = 4
    border_color = rgba(80, 171, 229, 1)
    position = 200, 260
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%a" | tr '[:lower:]' '[:upper:]')</b>"
    color = rgba(240, 230, 220, 1.0)
    font_size = 38
    font_family = JetBrainsMono Nerd Font
    position = 200, 150
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] date +"%d %B, %Y"
    color = rgba(0, 0, 0, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 200, 100
    halign = center
    valign = center
    zindex = 11
}

# SYSTEM/MEDIA STATUS CARD
shape {
    monitor =
    size = 360, 365
    color = rgba(67, 116, 188, 1)
    rounding = 25
    position = 200, -125
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
    zindex = 10
}

# Media Info
label {
    monitor =
    text = cmd[update:1000] player=$(playerctl -l 2>/dev/null | head -n 1); if [ "$player" = "spotify" ]; then echo "⊹₊⟡⋆ 💽 ༘˚⋆｡⋆𖦹."; elif [ -n "$player" ]; then echo "⊹₊⟡⋆ 💽 ༘˚⋆｡⋆𖦹."; else echo "⊹₊⟡⋆ 💽 ༘˚⋆｡⋆𖦹."; fi
    color = rgba(240, 230, 220, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 200, 20
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:1000] title=$(playerctl metadata xesam:title 2>/dev/null); if [ -z "$title" ]; then echo "No Music Playing"; else echo "$title" | fold -s -w 30; fi
    color = rgba(240, 230, 220, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 200, -20
    halign = center
    valign = center
    zindex = 11
    text_align  = center
}

label {
    monitor =
    text = cmd[update:1000] artist=$(playerctl metadata xesam:artist 2>/dev/null | cut -c1-30); if [ -z "$artist" ]; then echo "Play Some Music!!"; else echo "$artist"; fi &&  ~/.config/hypr/hyprlock/scripts/music.sh --album
    color = rgba(185, 175, 165, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 200, -55
    halign = center
    valign = center
    zindex = 11
    text_align = center
}

# Connectivity Buttons
shape {
    monitor =
    size = 150, 75
    color = rgba(199, 228, 247, 1)
    rounding = 20
    position = 115, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text =  <b> </b>
    color = rgba(25, 20, 20, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 115, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] wifi=$(nmcli -t -f ACTIVE,SSID dev wifi | grep '^yes' | cut -d: -f2- | cut -c1-14); if [ -z "$wifi" ]; then echo "Disconnected"; else echo "$wifi"; fi
    color = rgba(25, 20, 20, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 115, -145
    halign = center
    valign = center
    zindex = 12
}

shape {
    monitor =
    size = 150, 75
    color = rgba(199, 228, 247, 1)
    rounding = 20
    position = 285, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text =  <b> </b>
    color = rgba(25, 20, 20, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 285, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] bt=$(bluetoothctl info 2>/dev/null | grep "Name:" | cut -d ' ' -f 2- | cut -c 1-14); if [ -z "$bt" ]; then echo "Disconnected"; else echo "$bt"; fi
    color = rgba(25, 20, 20, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 285, -145
    halign = center
    valign = center
    zindex = 12
}

# Battery Bar
shape {
    monitor =
    size = 320, 100
    color = rgba(134, 197, 237, 1)
    rounding = 25
    position = 200, -235
    halign = center
    valign = center
    zindex = 11
}

# Battery Inner icon block
shape {
    monitor =
    size = 100, 20
    color = rgba(25, 20, 20, 1.0)
    rounding = 5
    position = 200, -205
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] status=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); if [ "$status" = "Discharging" ]; then echo " ▁▂▃▄▅▆▇▉ "; else echo " <b>󰚥</b> "; fi
    color = rgba(134, 197, 237, 1)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = 200, -209
    halign = center
    valign = center
    zindex = 13
}

label {
    monitor =
    text = cmd[update:1000] cat /sys/class/power_supply/BAT0/capacity | sed 's/.*/<b>&%<\/b>/'
    color = rgba(25, 20, 20, 1.0)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 200, -235
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] cat /sys/class/power_supply/BAT0/status
    color = rgba(25, 20, 20, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 200, -265
    halign = center
    valign = center
    zindex = 12
}
